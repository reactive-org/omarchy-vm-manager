---
- name: Ensure selected credentials configuration through native Omarchy tools
  ansible.builtin.command:
    argv: "{{ ['python3', omarchy_payload.path ~ '/apply-features.py', '--feature', 'credentials'] + (['--check'] if ansible_check_mode else []) }}"
    stdin: "{{ {'packages': omarchy_credential_packages} | to_json }}"
  register: omarchy_credentials_result
  changed_when: (omarchy_credentials_result.stdout | from_json).changed | bool
  check_mode: false

- name: Report credentials actions
  ansible.builtin.debug:
    var: omarchy_credentials_result.stdout
