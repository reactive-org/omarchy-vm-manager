---
- name: Ensure selected api configuration through native Omarchy tools
  ansible.builtin.command:
    argv: "{{ ['python3', omarchy_payload.path ~ '/apply-features.py', '--feature', 'api'] + (['--check'] if ansible_check_mode else []) }}"
    stdin: "{{ omarchy_api | to_json }}"
  register: omarchy_api_result
  changed_when: (omarchy_api_result.stdout | from_json).changed | bool
  check_mode: false

- name: Report api actions
  ansible.builtin.debug:
    var: omarchy_api_result.stdout
