---
- name: Ensure selected languages configuration through native Omarchy tools
  ansible.builtin.command:
    argv: "{{ ['python3', omarchy_payload.path ~ '/apply-features.py', '--feature', 'languages'] + (['--check'] if ansible_check_mode else []) }}"
    stdin: "{{ {'tools': omarchy_languages} | to_json }}"
  register: omarchy_languages_result
  changed_when: (omarchy_languages_result.stdout | from_json).changed | bool
  check_mode: false

- name: Report languages actions
  ansible.builtin.debug:
    var: omarchy_languages_result.stdout
