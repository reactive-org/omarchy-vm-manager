---
- name: Ensure selected vcs configuration through native Omarchy tools
  ansible.builtin.command:
    argv: "{{ ['python3', omarchy_payload.path ~ '/apply-features.py', '--feature', 'vcs'] + (['--check'] if ansible_check_mode else []) }}"
    stdin: "{{ omarchy_vcs | to_json }}"
  register: omarchy_vcs_result
  changed_when: (omarchy_vcs_result.stdout | from_json).changed | bool
  check_mode: false

- name: Report vcs actions
  ansible.builtin.debug:
    var: omarchy_vcs_result.stdout
