---
- name: Ensure selected build configuration through native Omarchy tools
  ansible.builtin.command:
    argv: "{{ ['python3', omarchy_payload.path ~ '/apply-features.py', '--feature', 'build'] + (['--check'] if ansible_check_mode else []) }}"
    stdin: "{{ omarchy_build | to_json }}"
  register: omarchy_build_result
  changed_when: (omarchy_build_result.stdout | from_json).changed | bool
  check_mode: false

- name: Report build actions
  ansible.builtin.debug:
    var: omarchy_build_result.stdout
