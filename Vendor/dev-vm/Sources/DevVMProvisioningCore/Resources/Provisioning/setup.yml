---
- name: Apply external workstation dotfiles and trusted tasks
  hosts: omarchy
  become: false
  gather_facts: true

  pre_tasks:
    - name: Require a non-root Omarchy ARM64 owner
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['architecture'] == 'aarch64'
          - ansible_facts['user_id'] != 'root'
      tags: [always]

    - name: Require native VM integration
      ansible.builtin.command:
        argv: [pacman, -Qq, try-omarchy]
      changed_when: false
      check_mode: false
      tags: [always]

  roles:
    - role: omarchy_setup
