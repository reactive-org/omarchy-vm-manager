name: Build and no-VM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Manager and artifact contracts
        run: make test
      - name: Build app, CLI and storage helper
        run: make build
      - name: Render and validate native app icon
        run: make icon
      - name: Exact patched upstream suite
        run: make test-upstream

  managed-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Real SSH with synthetic credentials and isolated containers
        run: make test-ssh
