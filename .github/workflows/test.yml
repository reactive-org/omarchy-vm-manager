name: Build and no-VM checks
# Pull requests cover work branches; pushes run only for the branches that
# publish releases, so a PR branch doesn't use two Mac runners per push.
#
# Changes that never reach the build skip the whole workflow, including the
# release a push to next or main would otherwise publish. LICENSE and
# THIRD_PARTY_NOTICES.md are deliberately not listed: Scripts/assemble_app.py
# bundles them and Scripts/verify_layout.py checks them. Avoid broad patterns
# such as '**.md' for the same reason.
#
# Branch protection has no required status checks today, so a skipped
# workflow doesn't block merging. If required checks are added, move this
# filter into a "changes" job and gate the other jobs with `if:`, so skipped
# jobs report success instead of leaving the check pending.
on:
  push:
    branches: [main, next]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'intent.md'
  pull_request:
    # Keep this list identical to the push list above.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'intent.md'
permissions:
  contents: read
jobs:
  test:
    name: macOS build and tests
    # Xcode 27 is only on GitHub's xcode-27 (macOS 27) preview image.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    # Cold ARM64 builds plus three optimized policy modes can exceed 40 minutes.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Verify the preinstalled Swift 6.2+ toolchain
        run: swift --version
      - name: Manager and artifact contracts
        run: make test
      - name: Isolated Dev channel build and no-VM contracts
        run: make test-dev test-provisioning-bundle-dev test-factory-screens
      - name: Optimized release and signed-prerelease admission
        run: make test-build-policies
      - name: Build app, CLI and storage helper
        run: make build
      - name: Render and validate native app icon
        run: make icon
      - name: Exact patched upstream suite
        run: make test-upstream TEST_JOBS=1

  managed-ssh:
    # These branches use fake/local acceptance only. This fixture builds a real
    # Docker image, so leave it for a separately authorized integration pass.
    if: github.head_ref != 'codex/factory-image-builder' && github.head_ref != 'codex/setup-system-update'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Real SSH with synthetic credentials and isolated containers
        run: make test-ssh

  release:
    name: Publish branch release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    needs: [test, managed-ssh]
    # Xcode 27 is only on GitHub's xcode-27 (macOS 27) preview image.
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: branch-app-publication
      queue: max
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Reserve the exact tested commit and automatic channel version
        id: plan
        run: make release-plan
      - name: Build, sign, notarize, staple and verify channel app
        if: steps.plan.outputs.skip != 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_KEYCHAIN_PROFILE_BASE64: ${{ secrets.MACOS_KEYCHAIN_PROFILE_BASE64 }}
          MACOS_DEV_KEYCHAIN_PROFILE_BASE64: ${{ secrets.MACOS_DEV_KEYCHAIN_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: make release-build
      - name: Retain exact candidates and public release evidence
        if: always() && steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: branch-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/notarization/*.json
            .build/branch-release.json
            .build/signed-release/kit/TryOmarchyKit.zip
            .build/signed-release/kit/TryOmarchyKit.json
            .build/signed-release/TryOmarchySignedRuntime.lock.json
            .build/signed-release/notary-app.zip
            .build/signed-release/notary-runtime.zip
            .build/signed-release/SourceRuntime.lock.json
            .build/signed-release/ReleaseSource.json
            dist/prerelease/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish the verified stable or Dev release
        if: steps.plan.outputs.skip != 'true'
        run: make release-publish
