name: Continue accepted v0.11.0 signed prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: signed-prerelease-v0.11.0-dev.1
  cancel-in-progress: false
jobs:
  continue:
    if: github.ref == 'refs/heads/codex/guest-touch-id'
    name: Verify retained runtime and finish v0.11.0-dev.1
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: v0.11.0-dev.1
          path: release-source
          submodules: true
          persist-credentials: false
      - name: Test continuation guards without signing credentials
        run: |
          test "$(uname -m)" = arm64
          make -C tooling prepare-source
          python3 -m unittest discover -s tooling/Tests/ScriptTests -v
      - name: Verify original CI run, tests, artifact and immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.11.0-dev.1
        run: |
          python3 tooling/Scripts/retained_candidate.py tooling/Config/SignedCandidates/v0.11.0-dev.1.json \
            release-source release-source/.build/retained-runtime
      - name: Verify fresh Apple acceptance and exact runtime archive binding
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          python3 tooling/Scripts/signed_prerelease.py --check-submission 4c6a7ba6-f9ce-4740-93f3-38c276534f3f \
            --check-archive release-source/.build/retained-runtime/TryOmarchyKit.zip
      - name: Prepare exact tagged source with reviewed continuation tooling
        working-directory: release-source
        run: |
          test "$(git rev-parse HEAD)" = 01631ee6ba261e85a22dd3f7959b60d678ababf8
          cp ../tooling/Scripts/signed_prerelease.py Scripts/signed_prerelease.py
          cp ../tooling/Scripts/retained_candidate.py Scripts/retained_candidate.py
          git diff --exit-code -- App Sources Config Package.swift Patches Vendor
          make fetch-runtime-kit prepare-source icon
      - name: Staple retained runtime, build tagged app, sign, notarize and verify
        working-directory: release-source
        env:
          RELEASE_TAG: v0.11.0-dev.1
          CONTINUATION_TOOLING_COMMIT: ${{ github.sha }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_KEYCHAIN_PROFILE_BASE64: ${{ secrets.MACOS_KEYCHAIN_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          python3 Scripts/signed_prerelease.py --resume-runtime .build/retained-runtime
          git diff --exit-code -- App Sources Config Package.swift Patches Vendor
      - name: Preserve exact candidates, submissions and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notarization-continuation-v0.11.0-dev.1
          path: |
            tooling/.build/notarization/*.json
            release-source/.build/notarization/*.json
            release-source/.build/retained-runtime/
            release-source/.build/signed-release/kit/TryOmarchyKit.zip
            release-source/.build/signed-release/kit/TryOmarchyKit.json
            release-source/.build/signed-release/TryOmarchySignedRuntime.lock.json
            release-source/.build/signed-release/notary-app.zip
            release-source/.build/signed-release/notary-runtime.zip
            release-source/dist/prerelease/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish verified immutable prerelease assets
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.11.0-dev.1 dist/prerelease/*.zip dist/prerelease/*.sha256 dist/prerelease/*.json \
            --verify-tag --prerelease --latest=false \
            --title "Omarchy VM Manager v0.11.0-dev.1 (signed and notarized)" \
            --notes-file dist/prerelease/release-notes.md
