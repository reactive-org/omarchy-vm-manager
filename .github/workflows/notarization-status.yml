name: Check existing prerelease notarization
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    name: Check Apple submission for v0.9.4-dev.1
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
      - uses: actions/checkout@v7
        with:
          ref: v0.9.4-dev.1
          path: release-source
      - name: Verify immutable release source
        working-directory: release-source
        run: test "$(git rev-parse HEAD)" = ef98347fde21cbdcb1002506c828e36e7ee9cda3
      - name: Query existing Apple submission without a new upload
        id: apple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python3 tooling/Scripts/signed_prerelease.py --check-submission c30ff885-b28d-4039-9314-1bf8f53267cf
      - name: Retain current Apple result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notarization-status-v0.9.4-dev.1
          path: tooling/.build/notarization/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
